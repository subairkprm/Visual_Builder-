name: codex-autonomous

on:
  workflow_dispatch:

jobs:
  codex-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Run Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec --full-auto \
            --output-schema ./schemas/final-report.schema.json \
            -o ./artifacts/final-report.json \
            "Read AGENTS.md and implement docs/specs/feature-request.md completely."

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: codex-final-report
          path: artifacts/final-report.json
